<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Protege">
  <!--
    "Orbit" — the Protege brand mark.

    Two shapes. A ring and a dot. The dot is held in the ring's gravity,
    traveling the arc of learning. Pure monochrome white. Single symbol
    that reads at any size from 14px to 200px.
  -->

  <!-- The orbit ring — mentorship, the path, the framework -->
  <circle
    cx="16" cy="16" r="10.5"
    stroke="white"
    stroke-width="1.9"
    stroke-linecap="round"
  />

  <!-- The protégé — a single filled dot on the ring's upper-right edge -->
  <circle cx="23.42" cy="8.58" r="2.9" fill="white"/>
</svg>
