name: Voice engine release

# Triggers when a tag matching `voice-v*` (e.g. voice-v0.0.1) is pushed.
# Builds the wake-word binary for 4 platforms, packages each into a
# tarball alongside the ONNX models, attaches them to a GitHub Release.
#
# fetchAssets.ts in the extension reads ASSET_VERSION (without the
# `voice-` prefix) and looks up the matching tarball on the release.
# So the tag name and ASSET_VERSION must agree:
#   tag           = voice-v0.0.1
#   ASSET_VERSION = v0.0.1
#
# To release: bump ASSET_VERSION in fetchAssets.ts, commit, then:
#   git tag voice-v0.0.1
#   git push origin voice-v0.0.1
# CI does the rest.

on:
  push:
    tags:
      - "voice-v*"
  # Manual trigger for testing the workflow without a tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.0.1) — manual runs only"
        required: true
        default: "v0.0.1-test"

# Default to read-only at the workflow level. Only the `release` job
# below escalates to `contents: write` because only that job creates the
# GitHub Release. Build matrix jobs only need read access for checkout
# and the `gh release download voice-models-base` step.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon — primary target, what most users have.
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            ext: ""
          # Intel Mac — older MacBooks and Hackintoshes.
          - os: macos-13
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            ext: ""
          # Linux x86_64 — most cloud + desktop Linux.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            ext: ""
            # ALSA dev headers are required by `cpal` to compile audio
            # backends on Linux. Without these the build fails with
            # "No package 'alsa' found".
            apt_deps: "libasound2-dev pkg-config"
          # Windows x86_64.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio deps
        if: matrix.apt_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/extension/native/mic/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('apps/extension/native/mic/Cargo.lock') }}

      - name: Build wake binary
        working-directory: apps/extension/native/mic
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary for packaging
        shell: bash
        run: |
          mkdir -p apps/extension/bin apps/extension/models
          BIN_NAME="protege-mic-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "apps/extension/native/mic/target/${{ matrix.target }}/release/protege-mic${{ matrix.ext }}" \
             "apps/extension/bin/${BIN_NAME}"
          chmod +x "apps/extension/bin/${BIN_NAME}" || true

      - name: Download ONNX models from prior release
        # Models are version-stable across tags unless you retrain. We
        # store them once on the GitHub Release for the FIRST tag and
        # re-fetch them here for every build. Avoids committing 2.5 MB
        # of binary blobs into git.
        # NOTE: First-time setup — see "Manual step #1" in voice-release.yml
        # README. After that, this step works automatically.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/extension/models
          for m in protege-oww.onnx embedding_model.onnx melspectrogram.onnx; do
            if [ ! -f "$m" ]; then
              echo "Fetching $m from voice-models-base release..."
              gh release download voice-models-base \
                --repo "${{ github.repository }}" \
                --pattern "$m" \
                --output "$m" \
                || { echo "ERROR: $m missing from voice-models-base release. Upload it once manually."; exit 1; }
            fi
          done
          ls -la

      - name: Package tarball
        shell: bash
        # Literal block scalar (`run: |`) preserves newlines; the prior
        # plain-scalar form folded `\<newline>` into literal escape-space,
        # so bash saw a leading space on `--platform` and rejected it as
        # an unknown flag.
        run: |
          bash apps/extension/scripts/package-voice-assets.sh \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }}

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/extension/release-artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release needs to create + edit releases
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # tag like 'voice-v0.0.1' → '0.0.1'-prefixed-with-v gets exported
            echo "tag=${GITHUB_REF#refs/tags/voice-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all platform tarballs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/*/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: voice-${{ steps.ver.outputs.tag }}
          name: Voice engine ${{ steps.ver.outputs.tag }}
          body: |
            Wake-word binary + ONNX models for the Protege voice engine.

            The extension's `fetchAssets.ts` looks for these tarballs at
            `${ASSET_VERSION}` matching the tag suffix. To activate:
            bump `ASSET_VERSION` in `apps/extension/src/voice/fetchAssets.ts`
            to `${{ steps.ver.outputs.tag }}` and re-publish the marketplace
            extension.
          files: artifacts/**/*.tar.gz
